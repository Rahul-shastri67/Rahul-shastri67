<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="electricBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .bg-line {
        stroke: #0f172a;
        stroke-width: 1;
        opacity: 0.4;
      }

      .dot {
        fill: #22d3ee;
        opacity: 0.0;
        animation: blink 4s infinite ease-in-out;
      }

      .dot:nth-child(1) { animation-delay: 0.3s; }
      .dot:nth-child(2) { animation-delay: 0.8s; }
      .dot:nth-child(3) { animation-delay: 1.4s; }
      .dot:nth-child(4) { animation-delay: 2.1s; }
      .dot:nth-child(5) { animation-delay: 2.6s; }

      .title {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 800;
        letter-spacing: 6px;
        text-transform: uppercase;
        fill: url(#electricBlue);
        filter: url(#glow);
        animation: pulse 3.5s infinite ease-in-out;
      }

      .subtitle {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 500;
        letter-spacing: 4px;
        text-transform: uppercase;
        fill: #e5e7eb;
        opacity: 0.9;
      }

      .tagline {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 500;
        letter-spacing: 8px;
        text-transform: uppercase;
        fill: #38bdf8;
        opacity: 0;
        animation: fadeIn 2.2s ease-out 0.8s forwards;
      }

      .code-bracket {
        fill: none;
        stroke: #22d3ee;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: url(#glow);
        opacity: 0.6;
        animation: float 4s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { text-shadow: 0 0 12px #0ea5e9; }
        50% { text-shadow: 0 0 24px #38bdf8; }
      }

      @keyframes blink {
        0%, 100% { opacity: 0.05; r: 3; }
        50% { opacity: 0.7; r: 5.5; }
      }

      @keyframes float {
        0%, 100% { transform: translateY(0px); opacity: 0.55; }
        50% { transform: translateY(-5px); opacity: 0.9; }
      }

      @keyframes fadeIn {
        to { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bgGradient)" />

  <!-- Subtle grid lines -->
  <g opacity="0.6">
    <line class="bg-line" x1="0" y1="40" x2="1200" y2="40" />
    <line class="bg-line" x1="0" y1="80" x2="1200" y2="80" />
    <line class="bg-line" x1="0" y1="120" x2="1200" y2="120" />
    <line class="bg-line" x1="0" y1="160" x2="1200" y2="160" />
    <line class="bg-line" x1="0" y1="200" x2="1200" y2="200" />
    <line class="bg-line" x1="0" y1="240" x2="1200" y2="240" />
  </g>

  <!-- Floating tech dots -->
  <g>
    <circle class="dot" cx="120" cy="70" r="4" />
    <circle class="dot" cx="260" cy="200" r="4" />
    <circle class="dot" cx="980" cy="80" r="4" />
    <circle class="dot" cx="1080" cy="220" r="4" />
    <circle class="dot" cx="640" cy="50" r="4" />
  </g>

  <!-- Code brackets icon -->
  <g transform="translate(150, 140)">
    <path class="code-bracket" d="M0 0 L-30 20 L0 40" />
    <path class="code-bracket" d="M90 0 L120 20 L90 40" />
  </g>

  <!-- Main text -->
  <text x="50%" y="150" text-anchor="middle" class="title" font-size="40">
    RAHUL SHASTRI
  </text>

  <text x="50%" y="190" text-anchor="middle" class="subtitle" font-size="18">
    FULL STACK DEVELOPER
  </text>

  <text x="50%" y="235" text-anchor="middle" class="tagline" font-size="14">
    ⚡ CODE • BUILD • DEPLOY • SCALE ⚡
  </text>
</svg>
